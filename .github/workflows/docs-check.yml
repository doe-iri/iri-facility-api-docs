name: Documentation checks

on:
  pull_request:
    paths:
      - docs/**
      - scripts/validate-docs.rb
      - .github/workflows/docs-check.yml
      - README.md
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/validate-docs.rb
      - .github/workflows/docs-check.yml
      - README.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate documentation sources
        run: ruby scripts/validate-docs.rb

      - name: Build the GitHub Pages site
        run: bundle exec jekyll build --source docs --destination _site/iri-facility-api-docs --trace

      - name: Check rendered internal links
        run: bundle exec htmlproofer _site --disable-external

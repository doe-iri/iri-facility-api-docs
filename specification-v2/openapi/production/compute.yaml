  /api/v2/compute/job/{resource_id}/{job_id}:
    put:
      tags:
      - compute
      summary: Update Job
      description: "Update a previously submitted job for a resource.\nNote that only\
        \ some attributes of a scheduled job can be updated. Check the facility documentation\
        \ for details.\n\n- **resource**: the name of the compute resource to use\n\
        - **job_request**: a PSIJ job spec as defined <a href=\"https://exaworks.org/psij-python/docs/v/0.9.11/.generated/tree.html#jobspec\"\
        >here</a>\n- **project/account resolution**:\n  The effective project/account\
        \ for the update must be supplied in exactly one place:\n  `job_spec.attributes.account`\
        \ or the trusted `X-IRI-Facility-Project` request header.\n  If the forwarded\
        \ header is present and valid, IRI treats its value as the effective facility-native\
        \ project/account\n  for downstream update handling and job metadata. If both\
        \ sources are present, or neither is present,\n  the request is rejected with\
        \ `400 Bad Request`.\n- **Idempotency-Key**: optional client-generated UUID.\
        \ Same semantics as submit_job."
      operationId: updateJob
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
